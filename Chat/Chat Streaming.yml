info:
  name: Chat Streaming
  type: http
  seq: 1

http:
  method: GET
  url: localhost:8080/api/chat?question=what is java?
  params:
    - name: question
      value: what is java?
      type: query
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{Token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
