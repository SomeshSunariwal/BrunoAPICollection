info:
  name: AI Search
  type: http
  seq: 2

http:
  method: GET
  url: localhost:8080/api/users/chat?query=what is real number?
  params:
    - name: query
      value: what is real number?
      type: query
  auth:
    type: bearer
    token: "{{Token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
