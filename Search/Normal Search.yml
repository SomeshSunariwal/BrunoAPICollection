info:
  name: Normal Search
  type: http
  seq: 1

http:
  method: GET
  url: localhost:8080/api/users/search?query=real?
  params:
    - name: query
      value: real?
      type: query
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{Token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
