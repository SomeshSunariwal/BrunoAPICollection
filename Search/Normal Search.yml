info:
  name: Normal Search
  type: http
  seq: 1

http:
  method: POST
  url: localhost:8080/api/users/search
  body:
    type: json
    data: |-
      {
        "searchTerm": "Requirement.txt"
      }
  auth:
    type: bearer
    token: "{{Token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
