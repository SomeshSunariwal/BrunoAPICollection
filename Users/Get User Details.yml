info:
  name: Get User Details
  type: http
  seq: 5

http:
  method: GET
  url: localhost:8080/api/users
  headers:
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: "{{Token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
